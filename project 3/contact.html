<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Golden Fork | Reservations</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="internal-nav">
        <div class="logo">The Golden Fork</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="about.html">Our Story</a></li>
                <li><a href="reviews.html">Reviews</a></li>
                <li><a href="contact.html" class="active">Reservations</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-container">
        <h1 class="page-title">Secure A Table</h1>
        <p class="page-subtitle">Plan your dining experience with us.</p>

        <div class="contact-wrapper">
            <div class="info-pane">
                <div class="info-block">
                    <h4>Location</h4>
                    <p>742 Culinary Lane,<br>District 4</p>
                </div>
                <div class="info-block">
                    <h4>Operational Hours</h4>
                    <p>Mon - Thu: 5 PM — 10 PM<br>Fri - Sun: 12 PM — 11 PM</p>
                </div>
                <div class="info-block">
                    <h4>Inquiries</h4>
                    <p>desk@thegoldenfork.com</p>
                </div>
            </div>

            <div class="form-pane">
                <form action="#">
                    <input type="text" placeholder="Full Name" required>
                    <input type="email" placeholder="Email Address" required>
                    <input type="date" required>
                    <select required>
                        <option value="" disabled selected>Party Dimension</option>
                        <option>2 Guests</option>
                        <option>4 Guests</option>
                        <option>6+ Guests</option>
                    </select>
                    <textarea class="full-width" rows="4" placeholder="Allergies or spatial preferences..."></textarea>
                    <button type="submit" class="btn-submit">Dispatch Request</button>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
