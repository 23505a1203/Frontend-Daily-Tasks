<!DOCTYPE html>
<html>
<head>
    <title>CSS Position</title>

<style>

.relative {
    position: relative;
    width: 500px;
    height: 300px;
    border: 3px solid black;
}

.absolute {
    position: absolute;
    right: 20px;
    bottom: 20px;
    background-color: orange;
    padding: 20px;
}

.fixed {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background-color: red;
    color: white;
    padding: 15px;
}

.sticky {
    position: sticky;
    top: 0;
    background-color: lightblue;
    padding: 20px;
}

</style>
</head>

<body>

<div class="relative">

    Relative

    <div class="absolute">
        Absolute
    </div>

</div>

<div class="sticky">
    Sticky
</div>

<div class="fixed">
    Fixed
</div>

<p style="height:1000px">
    Scroll the page.
</p>

</body>
</html>
