<!DOCTYPE html>
<html>
<head>
    <title>Table Images</title>
</head>
<body>

<h2>Product Details</h2>

<table border="1" cellpadding="10">

    <tr>
        <th>Image</th>
        <th>Product</th>
        <th>Price</th>
    </tr>

    <tr>
        <td>
            <img src="phone.jpg" width="100" height="100">
        </td>
        <td>Mobile Phone</td>
        <td>₹25,000</td>
    </tr>

    <tr>
        <td>
            <img src="laptop.jpeg" width="100" height="100">
        </td>
        <td>Laptop</td>
        <td>₹60,000</td>
    </tr>

    <tr>
        <td>
            <img src="watch.jpeg" width="100" height="100">
        </td>
        <td>Smart Watch</td>
        <td>₹5,000</td>
    </tr>

</table>

</body>
</html>
